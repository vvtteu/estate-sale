<!-- Стили для адаптивной панели -->
<style>
  /* Затемнение фона */
  #map-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(14,28,46,0.4);
    z-index: 499;
    backdrop-filter: blur(2px);
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  #map-overlay.visible {
    display: block;
    opacity: 1;
  }

  #map-drawer {
    position: fixed;
    top: 0;
    right: 0;
    width: 600px; 
    height: 100vh;
    height: 100dvh; 
    background: var(--white);
    z-index: 500;
    box-shadow: -8px 0 40px rgba(14,28,46,0.18);
    display: flex;
    flex-direction: column;
    transform: translateX(100%);
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    visibility: hidden; 
  }

 
  #map-drawer.open {
    transform: translateX(0);
    visibility: visible;
  }

  .drawer-header {
    display: flex;
    align-items: center;
    justify-content: right;
    padding: 5px 10px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    background: var(--white);
    z-index: 2;
  }

  #map-drawer-map {
    flex: 1;
    width: 100%;
    z-index: 1;
  }

  @media (max-width: 768px) {
    #map-drawer {
      width: 100%; 
    }
    .drawer-header {
      padding: 5px 10px; 
    }
  }
</style>
{% load i18n property_tags %}

<script>
  const TRANS = {
    openCard: "{% trans 'Открыть карточку' %}",
    lang: "{{ LANGUAGE_CODE|default:'ru' }}",  // ← текущий язык
  };
</script>

<div id="map-overlay"></div>

<div id="map-drawer">
  <div class="drawer-header">
    <!-- <span style="font-family: 'Cormorant Garamond', serif; font-size: 22px; color: var(--navy); font-weight: 600;">Расположение объекта</span> -->
    <button id="map-drawer-close" style="background: none; border: none; cursor: pointer; font-size: 26px; color: var(--text-muted); line-height: 1; padding: 5px;">
      <h5>X</h5>
    </button>
  </div>
  <div id="map-drawer-map"></div>
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
(function () {
  let allFeatures = null;
  let drawerMap = null;
  let drawerMarker = null;

  async function loadFeatures() {
    if (allFeatures) return allFeatures;
    const resp = await fetch("{% url 'properties:properties_geojson' %}");
    const data = await resp.json();
    allFeatures = data.features;
    return allFeatures;
  }

  function initDrawerMap() {
    if (drawerMap) return;
    drawerMap = L.map("map-drawer-map", {
      zoomControl: false
    }).setView([41.7151, 44.8271], 12);

    L.control.zoom({ position: 'bottomright' }).addTo(drawerMap);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "© OpenStreetMap contributors",
      maxZoom: 19,
    }).addTo(drawerMap);
  }

  async function openDrawer(propertyId) {
    const drawer = document.getElementById("map-drawer");
    const overlay = document.getElementById("map-overlay");

    overlay.classList.add("visible");
    drawer.classList.add("open");
    document.body.style.overflow = "hidden";

    initDrawerMap();

    const features = await loadFeatures();
    const feature = features.find(f => f.id === propertyId);

    if (!feature) {
      console.error("Объект не найден! ID:", propertyId);
      return;
    }

    setTimeout(() => {
      drawerMap.invalidateSize();
      drawerMap.setView([feature.lat, feature.lng], 16);

      if (drawerMarker) drawerMap.removeLayer(drawerMarker);

      const icon = L.divIcon({
        className: "",
        html: `<div style="
          width: 16px; height: 16px;
          background: #c9a24a;
          border: 3px solid #0e1c2e;
          border-radius: 50%;
          box-shadow: 0 2px 8px rgba(14,28,46,0.4);
        "></div>`,
        iconSize: [16, 16],
        iconAnchor: [8, 8],
        popupAnchor: [0, -12],
      });

      drawerMarker = L.marker([feature.lat, feature.lng], { icon })
      .addTo(drawerMap)
      .bindPopup(`
        <div style="min-width: 200px; font-family: 'Manrope', sans-serif; text-align: center;">
          ${feature.image
            ? `<img src="${feature.image}" style="width:100%; height:110px; object-fit:cover; border-radius:6px; margin-bottom:8px;">`
            : ""}
          <a href="/catalog/${feature.slug}/"
            style="color:#2f7a74; font-size:13px; font-weight:600; display:inline-block; border-bottom:1px solid currentColor; padding-bottom:2px;">
            ${TRANS.openCard} →
          </a>
        </div>
      `, { maxWidth: 260 })
      .openPopup();

    }, 350);
  }

  function closeDrawer() {
    document.getElementById("map-drawer").classList.remove("open");
    document.getElementById("map-overlay").classList.remove("visible");
    setTimeout(() => {
      document.body.style.overflow = "";
    }, 300);
  }

  document.getElementById("map-drawer-close").addEventListener("click", closeDrawer);
  document.getElementById("map-overlay").addEventListener("click", closeDrawer);

  window.openPropertyOnMap = openDrawer;
})();
</script>
