{% extends 'base.html' %}

{% block title %}Выход — Adjara Estate{% endblock %}

{% block extra_head %}
<style>
  .auth-wrapper { min-height: 70vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .auth-card { background: var(--white); width: 100%; max-width: 420px; border-radius: 18px; padding: 40px; box-shadow: 0 20px 40px rgba(14,28,46,0.06); text-align: center; border: 1px solid var(--border); }
  .auth-title { font-size: 24px; color: var(--navy); margin-bottom: 12px; font-family: 'Cormorant Garamond', serif; }
  .auth-desc { font-size: 15px; color: var(--text-muted); margin-bottom: 32px; line-height: 1.5; }
  
  .btn-submit { width: 100%; background: var(--navy); color: var(--white); border: none; padding: 14px; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; transition: background 0.2s; }
  .btn-submit:hover { background: var(--navy-2); }
</style>
{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <h1 class="auth-title">Выход из системы</h1>
    <p class="auth-desc">Вы уверены, что хотите выйти из своего аккаунта?</p>
    
    <form method="POST" action="{% url 'account_logout' %}">
      {% csrf_token %}
      {% if redirect_field_value %}
        <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}"/>
      {% endif %}
      <button type="submit" class="btn-submit">Да, выйти</button>
    </form>
  </div>
</div>
{% endblock %}
